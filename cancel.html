<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Запись на стенд</title>
	<base target="_top">

    <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
  </head>
  <body>
    <style>
      .checkbox-square {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .checkbox-square input {
        display: none;
      }

      .checkbox-square label {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        height: 38px;
        min-width: 70px;   /* фиксированная ширина времени */
        padding: 0 12px;
        border-radius: 4px;
        background: #f3f4f6;
        font-weight: 500;
        color: #444;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .checkbox-square label:hover {
        background: #e5e7eb;
      }

      .checkbox-square input:checked + label {
        background: var(--stand-color);
        color: white;
      }

      .checkbox-square .name {
        flex: 1;
      }
      
      .miniapp_c {
        position: relative;
        padding-bottom: 70px; /* Отступ для кнопки внизу */
      }

      /* Контент формы с прокруткой */
      .miniapp_f {
        max-height: calc(100vh - 80px); /* Высота с учетом отступа от кнопки */
        overflow-y: auto; /* Прокрутка по вертикали */
        padding: 20px;
      }

      /* Фиксированная кнопка внизу */
      .miniapp_s {
        position: fixed;
        bottom: 20px; /* Расположение кнопки на экране */
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 20px;
        font-size: 16px;
        z-index: 10; /* Чтобы кнопка была поверх остального контента */
      }
      .minispan
      {
        font-size:9px;
      }
      #form_loading
      {
        display:none !important;
        height:150px;
      }

      #stands_menu {
        display: flex;
        gap: 4px;
        flex-wrap: nowrap;      /* запрещаем перенос */
        overflow-x: auto;       /* если не влезет — можно скроллить */
      }

      #stands_menu .nav-item {
        flex: 0 0 auto;         /* НЕ растягивать */
      }

      .stand-tab {
        border: none;
        background: #f3f4f6;
        color: #555;
        transition: all 0.2s ease;
      }

      .stand-tab:not(.active) {
        opacity: 0.6;
      }

      .stand-tab:not(.active):hover {
        opacity: 0.85;
      }

      .stand-tab.active {
        color: white;
      }

      .stand-card {
        background: #ffffff;
        border-radius: 4px;
        box-shadow: 0 6px 24px rgba(0,0,0,0.04);
        border-left: 6px solid var(--stand-color);
        padding: 24px;
      }
      day-title {
        font-size: 15px;
        font-weight: 500;
        color: #222;
      }
      .miniapp_s {
        border-radius: 16px;
        padding: 12px 24px;
        font-weight: 500;
        box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      }
      .day-block {
        padding: 16px 0;
      }

      .day-block:not(:last-child) {
        border-bottom: 1px solid #ececec;
      }

      .time-grid {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
      }
      @media (max-width: 480px) {
        .time-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }
    </style>
    <div class="miniapp_c">

      <form id="form" class="miniapp_f" method="post" target="_top">
        <input type="hidden" name="chatId"/>
        <input type="hidden" name="name"/>
        Привет, <span id="name"></span>!
        
        <ul class="nav nav-tabs nav-fill" id="stands_menu" role="tablist">
          
        </ul>
        <div class="tab-content" id="stands_tabs">
          
        </div>
        <input class="miniapp_s btn btn-danger" type="submit" value="Отменить запись">
      </form>
    </div>
    <div id="form_loading" class="d-none flex-column justify-content-center align-items-center text-center">
		<span class="spinner-grow spinner-grow-sm" role="status" aria-hidden="true"></span>
		<span class="fs-5 mt-2">Подождите немного, данные загружаются.. <span id="smiles"></span></span>
	</div>
    <script>
		const GAS_URL = "https://script.google.com/macros/s/AKfycbzHB-6irK3Uqc-W8N8dY34YnE-k6bIgoruGApK79W0qK-r54G3j4XYn0k1jjSx5lV-Gig/exec";
		const params = new URLSearchParams(window.location.search);
		var chatId = params.get("chatId") || "";
		if (chatId) {
			console.log(`chatId взят из URL: ${chatId}`);
		} else {
			console.log("chatId не найден в URL");
		}
		const $chatInput = $('input[name=chatId]');
		if ($chatInput.length) {
			$chatInput.val(chatId);
		}
		try 
		{
			const tg = window.Telegram?.WebApp;
			if (tg)
			{
				tg.ready();
				tg.expand();

				if (tg.initDataUnsafe?.user?.id) 
				{
					chatId = tg.initDataUnsafe.user.id; // получаем chatId из Telegram
					if ($chatInput.length) $chatInput.val(chatId);
					console.log(`chatId взят из Telegram API: ${chatId}`);
				}
			}
			else
			{
				$("#installBtn").hide();
			}
		} catch (e) {
			console.warn("Telegram WebApp недоступен или произошла ошибка:", e);
		}

		function isDatePast(dateStr)
		{
			const formatted = (dateStr.split(',')[1]).trim().split('.').reverse().join('-');
			const today = new Date().toISOString().split('T')[0];
			return formatted < today;
		}

		$(".miniapp_c").hide();
		$("#form_loading").removeClass("d-none").addClass("d-flex");

		fetch(`${GAS_URL}?page=cancelparameters&chatId=${encodeURIComponent(chatId)}`)
			.then(r => r.json())
			.then(data => initApp(data))
			.catch(err => {
				alert("Ошибка загрузки данных");
				console.error(err);
			});
		
		function update_schedule()
    	{
			var name=$("input[name=name]").val();
			if (name in schedule)
			{
				$("#stands_menu").html("");
				si=0;
				for (stand in schedule[name])
				{
					si++;
					tclass=(si===1)?'active':'';
					$("#stands_menu").append(`<li class="nav-item" role="presentation">
						<button class="nav-link stand-tab ${tclass}" 
							data-color="${colors[stand]}"
							data-bs-toggle="tab" 
							data-bs-target="#stand${si}" 
							type="button" 
							role="tab">
							${stand}
						</button>
						</li>`);
          		}
				$('#stands_tabs').html("");
				si=0;
				var checkbox_index=0;
				for (stand in schedule[name])
				{
					si++;
					tclass=(si===1)?'show active':'';
					$('#stands_tabs').append(`<div class="tab-pane fade ${tclass}" id="stand${si}" role="tabpanel">
						<div class="card stand-card p-4" data-color="${colors[stand]}">
						</div>
					</div>`);
					$(`#stand${si} .stand-card`).css('--stand-color', colors[stand]);
					tab_init=true;
					var di=0;
					for (day in schedule[name][stand]) if (!isDatePast(day))
					{
						di++;
						$(`#stand${si} .card`).append(`<div class="day-block"><div class="day-title mb-2">${day}</div><div class="time-grid checkboxes${di}"></div></div>`);
						for (time in schedule[name][stand][day])
						{
							checkbox_index++;
							var companions=(publisher_usernames[name])?'<a href="https://t.me/'+publisher_usernames[name]+'">'+name+'</a>':name;
							for (publisher in schedule[name][stand][day][time])
							{
								var pname=publisher;
								if (publisher_usernames[publisher])
								{
									var prefix = ['https', ':', '//t.me/'].join('');
									// ${publisher_usernames[publisher]}
									pname='<a href="'+prefix+publisher_usernames[publisher]+'">'+publisher+'</a>';
								}
								companions+=(companions=='')?pname:', '+pname;
							}
							$(`#stand${si} .checkboxes${di}`).append(`<div class="checkbox-square">
									<input type="checkbox" id="cb_${checkbox_index}" name="times[]" value="${day}, ${stand}, ${time}"/>
									<label for="cb_${checkbox_index}">${time}</label>
									<span class="name fs-6 fst-italic">${companions}</span>
									</div>`);
						}
					}
					$(`#stand${si}`).css('--stand-color', colors[stand]);
				}
			}
			updateTabColors();
		}
		function updateTabColors() 
		{
			$(".stand-tab").each(function() {
			const color = $(this).data("color");

			if ($(this).hasClass("active")) {
				$(this).css("background-color", color);
				$(this).css("color", "#fff");
			} else {
				$(this).css("background-color", "#f3f4f6");
				$(this).css("color", "#555");
			}
			});
		}
		function initApp(data) 
		{
			$(".miniapp_c").show();
			$("#form_loading").addClass("d-none").removeClass("d-flex");

			const {
				smiles,
				default_name,
				publisher_usernames,
				schedule,
				colors,
				colors_light
			} = data;

			$("#smiles").html(smiles);
			$("#name").html(default_name);
			$("input[name=name]").val(default_name);
			update_schedule();
			$('button[data-bs-toggle="tab"]').on('shown.bs.tab', function () {
				updateTabColors();
			});

			$("#form").on("submit",function(){
				var ok=true;
				
				if ($("input[type=checkbox]:checked").length<1)
				{
					alert("Нужно выбрать хотя бы одну дату и время 🙂");
					return false;
				}
				$(".miniapp_c").hide();
				$("#form_loading").removeClass("d-none").addClass("d-flex");

				e.preventDefault(); // ❗ отменяем стандартную отправку
				const form = $(this);
				fetch(`${GAS_URL}?page=cancelsubmit&${form.serialize()}`)
					.then(r => r.json())
					.then(data => {
						$("#form_loading").html(data.html_report);
					})
					.catch(err => {
						alert("Ошибка загрузки данных");
						console.error(err);
					});
			});
		}
    </script>
  </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Запись на стенд</title>
	<base target="_top">

    <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
  </head>
  <body>
    <style>
      .checkbox-square {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .checkbox-square .label {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        height: 38px;
        min-width: 70px;   /* фиксированная ширина времени */
        padding: 0 12px;
        border-radius: 4px;
        background: #f3f4f6;
        font-weight: 500;
        color: #444;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .checkbox-square .label:hover {
        background: #e5e7eb;
      }

      .checkbox-square .name {
        flex: 1;
      }
      
      .miniapp_c {
        position: relative;
        padding-bottom: 70px; /* Отступ для кнопки внизу */
      }

      /* Контент формы с прокруткой */
      .miniapp_f {
        max-height: calc(100vh - 80px); /* Высота с учетом отступа от кнопки */
        overflow-y: auto; /* Прокрутка по вертикали */
        padding: 20px;
      }

      /* Фиксированная кнопка внизу */
      .miniapp_s {
        position: fixed;
        bottom: 20px; /* Расположение кнопки на экране */
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 20px;
        font-size: 16px;
        z-index: 10; /* Чтобы кнопка была поверх остального контента */
      }
      .minispan
      {
        font-size:9px;
      }
      #form_loading
      {
        height:150px;
      }

      #stands_menu {
        display: flex;
        gap: 4px;
        flex-wrap: nowrap;      /* запрещаем перенос */
        overflow-x: auto;       /* если не влезет — можно скроллить */
      }

      #stands_menu .nav-item {
        flex: 0 0 auto;         /* НЕ растягивать */
      }

      .stand-tab {
        border: none;
        background: #f3f4f6;
        color: #555;
        transition: all 0.2s ease;
      }

      .stand-tab:not(.active) {
        opacity: 0.6;
      }

      .stand-tab:not(.active):hover {
        opacity: 0.85;
      }

      .stand-tab.active {
        color: white;
      }

      .stand-card {
        background: #ffffff;
        border-radius: 4px;
        box-shadow: 0 6px 24px rgba(0,0,0,0.04);
        border-left: 6px solid var(--stand-color);
        padding: 24px;
      }
      day-title {
        font-size: 15px;
        font-weight: 500;
        color: #222;
      }
      .miniapp_s {
        border-radius: 16px;
        padding: 12px 24px;
        font-weight: 500;
        box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      }
      .day-block {
        padding: 16px 0;
      }

      .day-block:not(:last-child) {
        border-bottom: 1px solid #ececec;
      }

      .time-grid {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
      }
      @media (max-width: 480px) {
        .time-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }
    </style>
    <div class="miniapp_c">

        Привет, <span id="name"></span>!
    	<ul class="nav nav-tabs nav-fill" id="stands_menu" role="tablist">
          
        </ul>
        <div class="tab-content" id="stands_tabs">
          
        </div>
        <input class="miniapp_s btn btn-danger" type="submit" value="Отменить запись">
    </div>
    <div id="form_loading" class="d-none flex-column justify-content-center align-items-center text-center">
		<span class="spinner-grow spinner-grow-sm" role="status" aria-hidden="true"></span>
		<span class="fs-5 mt-2">Подождите немного, данные загружаются.. <span id="smiles"></span></span>
	</div>
    <script>
		const GAS_URL = "https://script.google.com/macros/s/AKfycbzHB-6irK3Uqc-W8N8dY34YnE-k6bIgoruGApK79W0qK-r54G3j4XYn0k1jjSx5lV-Gig/exec";
		const params = new URLSearchParams(window.location.search);
		var chatId = params.get("chatId") || "";
		if (chatId) {
			console.log(`chatId взят из URL: ${chatId}`);
		} else {
			console.log("chatId не найден в URL");
		}
		try 
		{
			const tg = window.Telegram?.WebApp;
			if (tg)
			{
				tg.ready();
				tg.expand();

				if (tg.initDataUnsafe?.user?.id) 
				{
					chatId = tg.initDataUnsafe.user.id; // получаем chatId из Telegram
					console.log(`chatId взят из Telegram API: ${chatId}`);
				}
			}
		} catch (e) {
			console.warn("Telegram WebApp недоступен или произошла ошибка:", e);
		}

		function isDatePast(dateStr)
		{
			const formatted = (dateStr.split(',')[1]).trim().split('.').reverse().join('-');
			const today = new Date().toISOString().split('T')[0];
			return formatted < today;
		}

		$(".miniapp_c").hide();
		$("#form_loading").removeClass("d-none").addClass("d-flex");

		fetch(`${GAS_URL}?page=viewparameters&chatId=${encodeURIComponent(chatId)}`)
			.then(r => r.json())
			.then(data => initApp(data))
			.catch(err => {
				alert("Ошибка загрузки данных");
				console.error(err);
			});
		function parseDate(dayString) {
			// "ПОНЕДЕЛЬНИК, 16.02.2026"
			const [, dateStr] = dayString.split(", ");
			const [dd, mm, yyyy] = dateStr.split(".").map(Number);
			return new Date(yyyy, mm - 1, dd);
		}
		function transformSchedule(oldSchedule) {
			const newSchedule = {};

			for (const name in oldSchedule) 
			{
				for (const stand in oldSchedule[name]) 
				{

					if (!newSchedule[stand]) 
					{
						newSchedule[stand] = {};
					}

					for (const day in oldSchedule[name][stand]) 
					{

						if (!newSchedule[stand][day]) 
						{
							newSchedule[stand][day] = {};
						}

						for (const time in oldSchedule[name][stand][day]) 
						{

							if (!newSchedule[stand][day][time]) 
							{
								newSchedule[stand][day][time] = {};
							}

							// добавляем текущего пользователя
							newSchedule[stand][day][time][name] = true;

							// если внутри уже были publisher'ы — переносим их
							for (const publisher in oldSchedule[name][stand][day][time]) 
							{
								newSchedule[stand][day][time][publisher] = true;
							}
						}
					}
				}
			}

			// --- СОРТИРОВКА ---
			const sortedSchedule = {};

			for (const stand in newSchedule) 
			{

				sortedSchedule[stand] = {};

				// сортируем дни по дате
				const sortedDays = Object.keys(newSchedule[stand]).sort((a, b) => {
					return parseDate(a) - parseDate(b);
				});

				for (const day of sortedDays) 
				{

					sortedSchedule[stand][day] = {};

					// сортируем время численно
					const sortedTimes = Object.keys(newSchedule[stand][day]).sort((a, b) => {
						return Number(a) - Number(b);
					});

					for (const time of sortedTimes) {
						sortedSchedule[stand][day][time] = newSchedule[stand][day][time];
					}
				}
			}

			return sortedSchedule;
		}

		function update_schedule()
    	{
			si=0;
			for (stand in schedule)
			{
				si++;
				tclass=(si===1)?'active':'';
				$("#stands_menu").append(`<li class="nav-item" role="presentation">
					<button class="nav-link stand-tab ${tclass}" 
						data-color="${colors[stand]}"
						data-bs-toggle="tab" 
						data-bs-target="#stand${si}" 
						type="button" 
						role="tab">
						${stand}
					</button>
					</li>`);
			}
			$('#stands_tabs').html("");
			si=0;
			for (stand in schedule)
			{
				si++;
				tclass=(si===1)?'show active':'';
				$('#stands_tabs').append(`<div class="tab-pane fade ${tclass}" id="stand${si}" role="tabpanel">
					<div class="card stand-card p-4" data-color="${colors[stand]}">
					</div>
				</div>`);
				$(`#stand${si} .stand-card`).css('--stand-color', colors[stand]);
				tab_init=true;
				var di=0;
				for (day in schedule[stand]) if (!isDatePast(day))
				{
					di++;
					$(`#stand${si} .card`).append(`<div class="day-block"><div class="day-title mb-2">${day}</div><div class="time-grid checkboxes${di}"></div></div>`);
					for (time in schedule[stand][day])
					{
						var companions="";
						for (publisher in schedule[stand][day][time])
						{
							var pname=publisher;
							if (publisher_usernames[publisher])
							{
								var prefix = ['https', ':', '//t.me/'].join('');
								pname='<a href="'+prefix+publisher_usernames[publisher]+'">'+publisher+'</a>';
							}
							companions+=(companions=='')?pname:', '+pname;
						}
						$(`#stand${si} .checkboxes${di}`).append(`<div class="checkbox-square">
									<div class="label">${time}</label>
									<span class="name fs-6 fst-italic">${companions}</span>
								</div>`);
					}
				}
				$(`#stand${si}`).css('--stand-color', colors[stand]);
			}
			updateTabColors();
		}
		function updateTabColors() 
		{
			$(".stand-tab").each(function() {
			const color = $(this).data("color");

			if ($(this).hasClass("active")) {
				$(this).css("background-color", color);
				$(this).css("color", "#fff");
			} else {
				$(this).css("background-color", "#f3f4f6");
				$(this).css("color", "#555");
			}
			});
		}
		var smiles=false;
		var default_name=false;
		var publisher_usernames=[];
		var schedule=[];
		var colors={};
		var colors_light={};
		function initApp(data) 
		{
			$(".miniapp_c").show();
			$("#form_loading").addClass("d-none").removeClass("d-flex");

			({
				smiles,
				default_name,
				publisher_usernames,
				schedule,
				colors,
				colors_light
			} = data);
			schedule = transformSchedule(schedule);

			$("#smiles").html(smiles);
			$("#name").html(default_name);
			update_schedule();
			$('button[data-bs-toggle="tab"]').on('shown.bs.tab', function () {
				updateTabColors();
			});
		}
    </script>
  </body>
</html>

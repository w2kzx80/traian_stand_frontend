<!DOCTYPE html>
<html>
  <head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Запись на стенд</title>
	<base target="_top">

    <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  </head>
  <body>
    <style>
      .miniapp_c {
        position: relative;
        padding-bottom: 70px; /* Отступ для кнопки внизу */
      }
      /* Контент формы с прокруткой */
      .miniapp_f {
        max-height: calc(100vh - 80px); /* Высота с учетом отступа от кнопки */
        overflow-y: auto; /* Прокрутка по вертикали */
        padding: 20px;
      }

      /* Фиксированная кнопка внизу */
      .miniapp_s {
        position: fixed;
        bottom: 20px; /* Расположение кнопки на экране */
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 20px;
        font-size: 16px;
        z-index: 10; /* Чтобы кнопка была поверх остального контента */
      }
      .minispan
      {
        font-size:9px;
      }
      #form_loading
      {
        height:150px;
      }
      .miniapp_s {
        border-radius: 16px;
        padding: 12px 24px;
        font-weight: 500;
        box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      }
    </style>
    <div class="miniapp_c">

      <form id="form" class="miniapp_f" method="post" target="_top">
        <input type="hidden" name="chatId"/>
        <div class="d-flex align-items-center mb-3">
          <select class="form-select me-2 required" name="name" style="flex: 1;">
            <option value="" selected disabled>ФИО</option>
          </select>
        </div>
        <input class="miniapp_s btn btn-success" type="submit" value="Отправить">
      </form>
    </div>
    <div id="form_loading" class="d-none flex-column justify-content-center align-items-center text-center">
		<span class="spinner-grow spinner-grow-sm" role="status" aria-hidden="true"></span>
		<span class="fs-5 mt-2">Подождите немного, данные загружаются.. <span id="smiles"></span></span>
	</div>
    <script>

		const GAS_URL = "https://script.google.com/macros/s/AKfycbzHB-6irK3Uqc-W8N8dY34YnE-k6bIgoruGApK79W0qK-r54G3j4XYn0k1jjSx5lV-Gig/exec";
		const params = new URLSearchParams(window.location.search);
		var chatId = params.get("chatId") || "";
		if (chatId) {
			console.log(`chatId взят из URL: ${chatId}`);
		} else {
			console.log("chatId не найден в URL");
		}
		const $chatInput = $('input[name=chatId]');
		if ($chatInput.length) {
			$chatInput.val(chatId);
		}
		try 
		{
			const tg = window.Telegram?.WebApp;
			if (tg)
			{
				tg.ready();
				tg.expand();

				if (tg.initDataUnsafe?.user?.id) 
				{
					chatId = tg.initDataUnsafe.user.id; // получаем chatId из Telegram
					if ($chatInput.length) $chatInput.val(chatId);
					console.log(`chatId взят из Telegram API: ${chatId}`);
				}
			}
		} catch (e) {
			console.warn("Telegram WebApp недоступен или произошла ошибка:", e);
		}

		$(".miniapp_c").hide();
		$("#form_loading").removeClass("d-none").addClass("d-flex");
			
		// --- Загружаем данные ---
		fetch(`${GAS_URL}?page=startparameters&chatId=${encodeURIComponent(chatId)}`)
			.then(r => r.json())
			.then(data => initApp(data))
			.catch(err => {
				alert("Ошибка загрузки данных");
				console.error(err);
			});

		function initApp(data) 
		{
			
			$(".miniapp_c").show();
			$("#form_loading").addClass("d-none").removeClass("d-flex");

			const {
				smiles,
				publishers,
			} = data;

			$("#smiles").html(smiles);
	
			for (var publisher in publishers)
			{
				$("select[name=name]").append(`<option value="${publisher}">${publisher}</option>`);
			}
			$("#form").on("submit",function(e)
			{
				var ok=true;
				if (!$("select[name=name]").val())
				{
					alert("Заполните ФИО 🙂");
					return false;
				}
				$(".miniapp_c").hide();
				$("#form_loading").removeClass("d-none").addClass("d-flex");
				
				e.preventDefault(); // ❗ отменяем стандартную отправку
				const form = $(this);
				fetch(`${GAS_URL}?page=startsubmit&${form.serialize()}`)
					.then(r => r.json())
					.then(data => {
						$("#form_loading").html(data.html_report);
					})
					.catch(err => {
						alert("Ошибка загрузки данных");
						console.error(err);
					});
			});
		}
    </script>
  </body>
</html>
